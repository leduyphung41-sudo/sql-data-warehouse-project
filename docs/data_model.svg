<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#2c2c2a">Gold Layer — Star Schema</text>

  <!-- dim_customers -->
  <rect x="40" y="90" width="230" height="230" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="155" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#042c53">dim_customers</text>
  <line x1="55" y1="126" x2="255" y2="126" stroke="#85b7eb"/>
  <text x="60" y="146" font-size="11" fill="#0c447c">customer_key (PK)</text>
  <text x="60" y="164" font-size="11" fill="#0c447c">customer_id</text>
  <text x="60" y="182" font-size="11" fill="#0c447c">customer_number</text>
  <text x="60" y="200" font-size="11" fill="#0c447c">first_name, last_name</text>
  <text x="60" y="218" font-size="11" fill="#0c447c">country</text>
  <text x="60" y="236" font-size="11" fill="#0c447c">marital_status</text>
  <text x="60" y="254" font-size="11" fill="#0c447c">gender</text>
  <text x="60" y="272" font-size="11" fill="#0c447c">birth_date</text>
  <text x="60" y="290" font-size="11" fill="#0c447c">create_date</text>

  <!-- fact_sales -->
  <rect x="335" y="140" width="230" height="200" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1.5"/>
  <text x="450" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#4a1b0c">fact_sales</text>
  <line x1="350" y1="176" x2="550" y2="176" stroke="#f0997b"/>
  <text x="355" y="196" font-size="11" fill="#712b13">order_number</text>
  <text x="355" y="214" font-size="11" fill="#712b13">product_key (FK)</text>
  <text x="355" y="232" font-size="11" fill="#712b13">customer_key (FK)</text>
  <text x="355" y="250" font-size="11" fill="#712b13">order_date, shipping_date, due_date</text>
  <text x="355" y="268" font-size="11" fill="#712b13">sales_amount</text>
  <text x="355" y="286" font-size="11" fill="#712b13">quantity, price</text>

  <!-- dim_products -->
  <rect x="630" y="90" width="230" height="230" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="745" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="#042c53">dim_products</text>
  <line x1="645" y1="126" x2="845" y2="126" stroke="#85b7eb"/>
  <text x="650" y="146" font-size="11" fill="#0c447c">product_key (PK)</text>
  <text x="650" y="164" font-size="11" fill="#0c447c">product_id, product_number</text>
  <text x="650" y="182" font-size="11" fill="#0c447c">product_name</text>
  <text x="650" y="200" font-size="11" fill="#0c447c">category_id, category</text>
  <text x="650" y="218" font-size="11" fill="#0c447c">subcategory</text>
  <text x="650" y="236" font-size="11" fill="#0c447c">maintenance</text>
  <text x="650" y="254" font-size="11" fill="#0c447c">cost, product_line</text>
  <text x="650" y="272" font-size="11" fill="#0c447c">start_date</text>

  <!-- relationships -->
  <path d="M270,220 L335,220" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <text x="302" y="212" text-anchor="middle" font-size="10" fill="#5f5e5a">1:N</text>
  <path d="M630,220 L565,220" stroke="#5f5e5a" stroke-width="1.5" fill="none" marker-end="url(#arrow2)"/>
  <text x="598" y="212" text-anchor="middle" font-size="10" fill="#5f5e5a">1:N</text>

  <text x="450" y="400" text-anchor="middle" font-size="11" fill="#888780">fact_sales: 60,398 rows — 0 orphan customer_key / product_key references (verified)</text>
  <text x="450" y="420" text-anchor="middle" font-size="11" fill="#888780">Built on top of gold.report_customers and gold.report_products for pre-aggregated reporting</text>
</svg>
